<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stepBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091414"/>
      <stop offset="100%" stop-color="#040a0a"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="sBlur">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#stepBg)"/>

  <!-- Blueprint grid lines -->
  <g stroke="#14b8a6" stroke-opacity="0.08" stroke-width="1">
    <circle cx="280" cy="250" r="180" fill="none"/>
    <circle cx="280" cy="250" r="120" fill="none"/>
    <line x1="280" y1="50" x2="280" y2="450"/>
    <line x1="80" y1="250" x2="480" y2="250"/>
  </g>

  <!-- Insole Contour Silhouette (Plantar) -->
  <path d="M 280 80 C 330 80 345 130 345 190 C 345 250 315 280 310 330 C 305 380 320 410 280 410 C 240 410 255 380 250 330 C 245 280 215 250 215 190 C 215 130 230 80 280 80 Z" fill="#0d2826" stroke="#2dd4bf" stroke-width="2" filter="url(#sBlur)"/>

  <!-- FSR Pressure Sensor Nodes on Insole -->
  <!-- Metatarsal (Ball of foot) -->
  <circle cx="260" cy="160" r="22" fill="#ef4444" fill-opacity="0.7" filter="url(#sBlur)"/>
  <circle cx="295" cy="155" r="18" fill="#f59e0b" fill-opacity="0.8" filter="url(#sBlur)"/>
  <text x="260" y="164" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">FSR 1</text>
  <text x="295" y="159" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">FSR 2</text>

  <!-- Arch (PVDF) -->
  <rect x="245" y="240" width="70" height="25" rx="6" fill="#14b8a6" fill-opacity="0.5" stroke="#2dd4bf" stroke-dasharray="2,2"/>
  <text x="280" y="256" fill="#ccfbf1" font-family="monospace" font-size="9" text-anchor="middle">PVDF PIEZO</text>

  <!-- Heel strike -->
  <circle cx="280" cy="360" r="24" fill="#06b6d4" fill-opacity="0.6" filter="url(#sBlur)"/>
  <text x="280" y="364" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">HEEL FSR</text>

  <!-- Microcontroller board & Telemetry on Right -->
  <g transform="translate(500, 80)">
    <!-- ESP32-C3 Module -->
    <rect x="20" y="30" width="220" height="150" rx="12" fill="#0f2122" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="35" y="45" width="80" height="80" rx="6" fill="#134e4a"/>
    <text x="75" y="85" fill="#5eead4" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">ESP32-C3</text>
    <text x="75" y="100" fill="#99f6e4" font-family="monospace" font-size="8" text-anchor="middle">RISC-V 160MHz</text>

    <!-- MPU6050 IC -->
    <rect x="135" y="45" width="85" height="40" rx="4" fill="#1e293b" stroke="#64748b"/>
    <text x="177" y="68" fill="#e2e8f0" font-family="monospace" font-size="9" text-anchor="middle">MPU-6050</text>
    <text x="177" y="80" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">6-DOF IMU (I2C)</text>

    <!-- BLE Status -->
    <circle cx="145" cy="112" r="5" fill="#10b981"/>
    <text x="158" y="115" fill="#a7f3d0" font-family="monospace" font-size="9">BLE 5.0 LIVE</text>

    <!-- Realtime Gait Oscilloscope Waveform -->
    <rect x="20" y="210" width="220" height="90" rx="10" fill="#061818" stroke="#14b8a6" stroke-width="1"/>
    <path d="M 30 255 Q 60 215 90 255 T 150 255 T 210 255" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text x="35" y="230" fill="#5eead4" font-family="monospace" font-size="9">GAIT STRIKE TELEMETRY</text>
    <text x="190" y="285" fill="#f59e0b" font-family="monospace" font-size="9">84 BPM</text>

    <!-- Biomechanical Feedback badge -->
    <rect x="20" y="320" width="220" height="35" rx="8" fill="#115e59" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="1"/>
    <text x="130" y="342" fill="#2dd4bf" font-family="monospace" font-size="10" text-anchor="middle">PRONATION ANALYSIS</text>
  </g>
</svg>
