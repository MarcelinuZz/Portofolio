<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pocketBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="pBlur">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#pocketBg)"/>

  <!-- Subtle background grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Phone Mockup Frame (Flutter) -->
  <rect x="140" y="60" width="220" height="380" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" filter="url(#pBlur)"/>
  
  <!-- Screen Notch & Speaker -->
  <rect x="210" y="74" width="80" height="6" rx="3" fill="#334155"/>

  <!-- Inside Phone: Balance Card -->
  <rect x="160" y="105" width="180" height="90" rx="14" fill="url(#cardGrad)"/>
  <text x="175" y="130" fill="#e0f2fe" font-family="sans-serif" font-size="10">Total Balance</text>
  <text x="175" y="160" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">$14,850.40</text>
  <text x="175" y="180" fill="#bae6fd" font-family="monospace" font-size="9">•••• 4829 | VISA</text>

  <!-- Transaction items inside phone -->
  <rect x="160" y="210" width="180" height="42" rx="8" fill="#1e293b"/>
  <circle cx="180" cy="231" r="10" fill="#0284c7" fill-opacity="0.3"/>
  <text x="198" y="228" fill="#f8fafc" font-family="sans-serif" font-size="10">Cloud Server</text>
  <text x="198" y="242" fill="#94a3b8" font-family="sans-serif" font-size="8">DevOps &amp; Infra</text>
  <text x="325" y="235" fill="#f43f5e" font-family="monospace" font-size="10" text-anchor="end">-$42.00</text>

  <rect x="160" y="260" width="180" height="42" rx="8" fill="#1e293b"/>
  <circle cx="180" cy="281" r="10" fill="#10b981" fill-opacity="0.3"/>
  <text x="198" y="278" fill="#f8fafc" font-family="sans-serif" font-size="10">Stripe Payout</text>
  <text x="198" y="292" fill="#94a3b8" font-family="sans-serif" font-size="8">Client Retainer</text>
  <text x="325" y="285" fill="#10b981" font-family="monospace" font-size="10" text-anchor="end">+$1,250</text>

  <!-- Microservices Architecture Diagram on Right -->
  <g transform="translate(420, 90)">
    <!-- API Gateway Box -->
    <rect x="60" y="10" width="180" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="32" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">API GATEWAY</text>
    <text x="150" y="48" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Express.js / JWT</text>

    <!-- Connectors -->
    <path d="M 150 60 L 150 100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 60 100 L 240 100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 60 100 L 60 130" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 150 100 L 150 130" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 240 100 L 240 130" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Service 1: Auth -->
    <rect x="10" y="130" width="100" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="60" y="155" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">Auth Service</text>
    <text x="60" y="172" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Node / Redis</text>

    <!-- Service 2: Ledger -->
    <rect x="100" y="130" width="100" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="155" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Transactions</text>
    <text x="150" y="172" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">MySQL Cluster</text>

    <!-- Service 3: Analytics -->
    <rect x="190" y="130" width="100" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="240" y="155" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">Analytics</text>
    <text x="240" y="172" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Aggregator</text>

    <!-- Docker badge -->
    <rect x="50" y="240" width="200" height="40" rx="8" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="150" y="264" fill="#7dd3fc" font-family="monospace" font-size="11" text-anchor="middle">DOCKER CONTAINERIZED</text>
  </g>
</svg>
