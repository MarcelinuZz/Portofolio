<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c1e"/>
      <stop offset="100%" stop-color="#07040d"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="aiFilter">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#aiBg)"/>

  <!-- Neural Mesh Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="50" x2="700" y2="450"/>
    <line x1="700" y1="50" x2="100" y2="450"/>
    <circle cx="400" cy="250" r="220" fill="none"/>
    <circle cx="400" cy="250" r="150" fill="none"/>
  </g>

  <!-- Left: Symptom Vector & Random Forest Tree Nodes -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="280" height="340" rx="16" fill="#1e1136" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" filter="url(#aiFilter)"/>
    <text x="25" y="35" fill="#f3e8ff" font-family="sans-serif" font-weight="bold" font-size="13">SYMPTOM VECTOR</text>
    <line x1="25" y1="50" x2="255" y2="50" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Symptoms pills -->
    <rect x="25" y="70" width="105" height="28" rx="14" fill="#581c87" fill-opacity="0.6"/>
    <text x="77" y="88" fill="#e9d5ff" font-family="sans-serif" font-size="10" text-anchor="middle">Fever (38.8°C)</text>

    <rect x="140" y="70" width="100" height="28" rx="14" fill="#581c87" fill-opacity="0.6"/>
    <text x="190" y="88" fill="#e9d5ff" font-family="sans-serif" font-size="10" text-anchor="middle">Dry Cough</text>

    <rect x="25" y="110" width="95" height="28" rx="14" fill="#581c87" fill-opacity="0.6"/>
    <text x="72" y="128" fill="#e9d5ff" font-family="sans-serif" font-size="10" text-anchor="middle">Fatigue</text>

    <rect x="130" y="110" width="110" height="28" rx="14" fill="#581c87" fill-opacity="0.6"/>
    <text x="185" y="128" fill="#e9d5ff" font-family="sans-serif" font-size="10" text-anchor="middle">Chest Tightness</text>

    <!-- Model Confidence Bars -->
    <text x="25" y="180" fill="#c084fc" font-family="monospace" font-size="10">DISEASE PREDICTION:</text>
    
    <text x="25" y="210" fill="#f3e8ff" font-family="sans-serif" font-size="11">Acute Bronchitis</text>
    <text x="255" y="210" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="end">88.4%</text>
    <rect x="25" y="220" width="230" height="6" rx="3" fill="#3b0764"/>
    <rect x="25" y="220" width="203" height="6" rx="3" fill="url(#purpleGlow)"/>

    <text x="25" y="255" fill="#f3e8ff" font-family="sans-serif" font-size="11">Viral Pneumonia</text>
    <text x="255" y="255" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="end">9.1%</text>
    <rect x="25" y="265" width="230" height="6" rx="3" fill="#3b0764"/>
    <rect x="25" y="265" width="21" height="6" rx="3" fill="#a855f7"/>

    <text x="25" y="300" fill="#94a3b8" font-family="monospace" font-size="9">RandomForestClassifier (100 Estimators)</text>
  </g>

  <!-- Right: Facility Triage Recommendation Map -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="300" height="340" rx="16" fill="#140d25" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <text x="30" y="35" fill="#fce7f3" font-family="sans-serif" font-weight="bold" font-size="13">TRIAGE &amp; FACILITY ROUTING</text>
    <line x1="30" y1="50" x2="270" y2="50" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Recommended Facility Card -->
    <rect x="25" y="75" width="250" height="90" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" filter="url(#aiFilter)"/>
    <circle cx="55" cy="115" r="16" fill="#ec4899" fill-opacity="0.3"/>
    <!-- Medical Cross -->
    <rect x="53" y="107" width="4" height="16" fill="#f472b6"/>
    <rect x="47" y="113" width="16" height="4" fill="#f472b6"/>

    <text x="85" y="105" fill="#fdf4ff" font-family="sans-serif" font-weight="bold" font-size="12">RECOMMENDED TIER:</text>
    <text x="85" y="125" fill="#f472b6" font-family="sans-serif" font-size="11">Specialized Pulmonary Clinic</text>
    <text x="85" y="142" fill="#c084fc" font-family="monospace" font-size="9">Urgency Level: Moderate (Within 24h)</text>

    <!-- Other facility tiers -->
    <rect x="25" y="185" width="250" height="46" rx="8" fill="#1e1b4b"/>
    <text x="45" y="212" fill="#94a3b8" font-family="sans-serif" font-size="10">Emergency Room (High Urgency)</text>
    <text x="250" y="212" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">Tier 1</text>

    <rect x="25" y="245" width="250" height="46" rx="8" fill="#1e1b4b"/>
    <text x="45" y="272" fill="#94a3b8" font-family="sans-serif" font-size="10">General Teleconsult (Low Urgency)</text>
    <text x="250" y="272" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">Tier 3</text>

    <!-- Scikit-learn badge -->
    <text x="150" y="320" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="middle">FASTAPI + SCIKIT-LEARN PIPELINE</text>
  </g>
</svg>
